name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'

      - name: Build from Smali and resources
        run: bash scripts/build-apk.sh

      - name: Align, debug-sign, and verify APK
        run: bash scripts/sign-debug-apk.sh

      - name: Record artifact checksums
        shell: bash
        run: |
          cd out
          sha256sum examcipus1-unsigned.apk examcipus1-debug.apk > SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: examcipus1-apks-${{ github.run_number }}
          path: |
            out/examcipus1-unsigned.apk
            out/examcipus1-debug.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
